[project]
name = "docs-rag-assistant"
version = "0.1.0"
description = "Hybrid retrieval-augmented QA over the vLLM documentation, with an evaluation quality gate."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
