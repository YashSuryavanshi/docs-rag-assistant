<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vLLM Docs Assistant</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 360px; padding: .6rem; font-size: 1rem; }
  select, button { padding: .6rem 1rem; font-size: 1rem; }
  #status { margin: 1rem 0; color: #555; }
  #answer { background: #f3f7ff; border-left: 4px solid #3b6fe0; padding: .8rem 1rem; white-space: pre-wrap; }
  .passage { border: 1px solid #ddd; border-radius: 6px; padding: .6rem .9rem; margin: .8rem 0; }
  .passage .meta { font-size: .85rem; color: #555; margin-bottom: .4rem; }
  .passage pre { white-space: pre-wrap; margin: 0; font-family: inherit; font-size: .92rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>vLLM Docs Assistant</h1>
<form id="f">
  <input id="q" type="text" minlength="3" maxlength="1000" required
         placeholder="e.g. How do I enable automatic prefix caching?">
  <select id="mode" title="retrieval mode">
    <option value="hybrid_rerank">hybrid + rerank</option>
    <option value="hybrid">hybrid</option>
    <option value="dense">dense only</option>
    <option value="sparse">BM25 only</option>
  </select>
  <button id="go">Ask</button>
</form>
<div id="status"></div>
<div id="answerBox" class="hidden"><h2>Answer</h2><div id="answer"></div></div>
<div id="passages"></div>

<script>
const $ = (id) => document.getElementById(id);

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true;
  $("status").textContent = "Searching...";
  $("answerBox").classList.add("hidden");
  $("passages").replaceChildren();
  try {
    const r = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: $("q").value, mode: $("mode").value }),
    });
    if (!r.ok) throw new Error(r.status + " " + (await r.text()));
    const data = await r.json();

    // textContent everywhere: passages come from documents, never inject them as HTML.
    $("answer").textContent = data.answer ?? "(no LLM configured, showing retrieved passages only)";
    $("answerBox").classList.remove("hidden");

    data.passages.forEach((p, i) => {
      const div = document.createElement("div");
      div.className = "passage";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `[${i + 1}] ${p.source}  |  ${p.heading_path}  |  score ${p.score.toFixed(3)}`;
      const pre = document.createElement("pre");
      pre.textContent = p.text;
      div.append(meta, pre);
      $("passages").append(div);
    });
    $("status").textContent = "Timings (ms): " +
      Object.entries(data.timings_ms).map(([k, v]) => `${k} ${v.toFixed(0)}`).join(", ");
  } catch (err) {
    $("status").textContent = "Error: " + err.message;
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
