apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # never drop below current capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels: { app: rag-api }
  template:
    metadata:
      labels: { app: rag-api }
    spec:
      containers:
        - name: api
          image: docs-rag-assistant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef: { name: rag-config }
          # Startup: model loading takes a while; allow up to 2 minutes before
          # liveness checks begin, instead of killing a pod that is still loading.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          # Readiness: only receive traffic once models are loaded AND the index is non-empty.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1536Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag
spec:
  selector: { app: rag-api }
  ports:
    - port: 80
      targetPort: http
---
# The cross-encoder reranker is the CPU-heavy step, so CPU utilisation is a
# reasonable scaling signal for this service.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-api
  namespace: rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
