# Qdrant runs as a StatefulSet: it owns data on disk, so it needs a stable
# identity and a PersistentVolumeClaim that survives pod restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: rag
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          ports:
            - containerPort: 6333
              name: http
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: rag
spec:
  selector: { app: qdrant }
  ports:
    - port: 6333
      targetPort: http
