name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest -q

  # Quality gate: rebuild the index and fail the PR if retrieval metrics fall
  # below eval/thresholds.yaml. Catches changes (chunking, models, fusion
  # weights) that silently make answers worse while every unit test still passes.
  retrieval-quality:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements.txt

      # Model weights and computed embeddings are cached between runs, so a PR
      # that only touches retrieval logic does not re-embed the whole corpus.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            data/cache
          key: rag-${{ hashFiles('data/corpus/MANIFEST.json', 'rag/chunking.py', 'rag/config.py') }}
          # Stale entries are harmless: the embedding cache is keyed by text content.
          restore-keys: rag-

      - run: python scripts/fetch_corpus.py --ref pinned
      - run: python -m rag index --full
      - run: python -m eval.run_eval --mode hybrid_rerank --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/latest.json
